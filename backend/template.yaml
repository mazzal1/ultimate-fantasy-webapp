AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ultimate Fantasy TTRPG backend

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - delivery
      - prod
    Default: dev
  CognitoUserPoolId:
    Type: AWS::SSM::Parameter::Value<String>
  CognitoUserPoolClientId:
    Type: AWS::SSM::Parameter::Value<String>
  LambdaSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
  LambdaSecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
  SharedLambdaExecutionRoleArn:
    Type: AWS::SSM::Parameter::Value<String>
  PostgresUri:
    Type: AWS::SSM::Parameter::Value<String>

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    VpcConfig:
      SecurityGroupIds:
        - !Ref LambdaSecurityGroupId
      SubnetIds: !Ref LambdaSubnetIds
    Environment:
      Variables:
        STAGE: !Ref Stage
        POSTGRES_URI: !Ref PostgresUri
        POSTGRES_SSL: 'true'
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClientId

Resources:
  GraphQlApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub ultimate-fantasy-${Stage}
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        AwsRegion: !Ref AWS::Region
        DefaultAction: ALLOW
        UserPoolId: !Ref CognitoUserPoolId
      AdditionalAuthenticationProviders:
        - AuthenticationType: API_KEY
      XrayEnabled: true

  GraphQlSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQlApi.ApiId
      Definition: |
        scalar AWSDateTime

        enum Rank {
          F
          E
          D
          C
          B
          A
          S
        }

        enum AbilityKind {
          SKILL
          ITEM
        }

        type Character {
          id: ID!
          userId: ID!
          name: String!
          playerName: String
          gender: String
          race: String
          age: Int
          background: String
          level: Int!
          statPoints: Int!
          skillPoints: Int!
          coreStats: CoreStats!
          currentHp: Int!
          maxHp: Int!
          currentMana: Int!
          maxMana: Int!
          currentStamina: Int!
          maxStamina: Int!
          wounds: Int!
          competencyStates: [CharacterCompetencyState!]!
          skillStates: [CharacterSkillState!]!
          titleIds: [ID!]!
          itemStates: [CharacterItemState!]!
          competencies: [CharacterCompetency!]!
          skills: [CharacterSkill!]!
          titles: [Title!]!
          items: [CharacterItem!]!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type CoreStats {
          strength: Rank!
          agility: Rank!
          dexterity: Rank!
          resilience: Rank!
          magic: Rank!
          willpower: Rank!
          acumen: Rank!
          charisma: Rank!
          luck: Rank!
        }

        type CharacterCompetencyState {
          competencyId: ID!
          rank: Rank!
        }

        type CharacterSkillState {
          skillId: ID!
          rank: Rank!
        }

        type CharacterItemState {
          itemId: ID!
          equipped: Boolean!
        }

        type CharacterCompetency {
          competency: Competency!
          rank: Rank!
        }

        type CharacterSkill {
          skill: Skill!
          rank: Rank!
        }

        type CharacterItem {
          item: Item!
          equipped: Boolean!
        }

        type Campaign {
          id: ID!
          name: String!
          description: String
          notes: String
          gameMasterId: ID!
          playerIds: [ID!]!
          characterIds: [ID!]!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Skill {
          id: ID!
          ownerUserId: ID
          name: String!
          description: String!
          maxRank: Rank!
          activationType: String!
          manaCost: Int!
          staminaCost: Int!
          minLevelRequirement: Int!
          requiredAbilityIds: [ID!]!
          requiredTitleIds: [ID!]!
          tags: [String!]!
          isSystem: Boolean!
          sharedCampaignIds: [ID!]!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Item {
          id: ID!
          ownerUserId: ID
          name: String!
          description: String!
          maxRank: Rank!
          activationType: String!
          manaCost: Int!
          staminaCost: Int!
          minLevelRequirement: Int!
          requiredAbilityIds: [ID!]!
          requiredTitleIds: [ID!]!
          tags: [String!]!
          isSystem: Boolean!
          sharedCampaignIds: [ID!]!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Competency {
          id: ID!
          ownerUserId: ID
          name: String!
          description: String!
          tags: [String!]!
          isSystem: Boolean!
          sharedCampaignIds: [ID!]!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Title {
          id: ID!
          name: String!
          description: String!
          isSystem: Boolean!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type User {
          id: ID!
          email: String!
          username: String!
          characterCount: Int!
        }

        type Query {
          getCharacter(id: ID!): Character
          listMyCharacters: [Character!]!
          getCampaign(id: ID!): Campaign
          listMyCampaigns: [Campaign!]!
          listCampaignCharacters(campaignId: ID!): [Character!]!
          listSkills(tag: String, search: String): [Skill!]!
          listItems(tag: String, search: String): [Item!]!
          listCompetencies(search: String): [Competency!]!
          listTitles: [Title!]!
          getSkill(id: ID!): Skill
          getMe: User
        }

        type Mutation {
          createCharacter(input: CreateCharacterInput!): Character!
          updateCharacter(id: ID!, input: UpdateCharacterInput!): Character!
          deleteCharacter(id: ID!): Boolean!
          createCampaign(input: CreateCampaignInput!): Campaign!
          updateCampaign(id: ID!, input: UpdateCampaignInput!): Campaign!
          joinCampaign(campaignId: ID!): Campaign!
          assignCharacterToCampaign(campaignId: ID!, characterId: ID!): Campaign!
          createSkill(input: CreateSkillInput!): Skill!
          updateSkill(id: ID!, input: UpdateSkillInput!): Skill!
          shareSkill(skillId: ID!, campaignId: ID!): Skill!
          createCompetency(input: CreateCompetencyInput!): Competency!
          shareCompetency(competencyId: ID!, campaignId: ID!): Competency!
        }

        input CoreStatsInput {
          strength: Rank
          agility: Rank
          dexterity: Rank
          resilience: Rank
          magic: Rank
          willpower: Rank
          acumen: Rank
          charisma: Rank
          luck: Rank
        }

        input CharacterCompetencyStateInput {
          competencyId: ID!
          rank: Rank!
        }

        input CharacterSkillStateInput {
          skillId: ID!
          rank: Rank!
        }

        input CharacterItemStateInput {
          itemId: ID!
          equipped: Boolean!
        }

        input CreateCharacterInput {
          name: String!
          playerName: String
          gender: String
          race: String
          age: Int
          background: String
          level: Int
          statPoints: Int
          skillPoints: Int
          coreStats: CoreStatsInput
          currentHp: Int
          maxHp: Int
          currentMana: Int
          maxMana: Int
          currentStamina: Int
          maxStamina: Int
          wounds: Int
          competencyStates: [CharacterCompetencyStateInput!]
          skillStates: [CharacterSkillStateInput!]
          titleIds: [ID!]
          itemStates: [CharacterItemStateInput!]
        }

        input UpdateCharacterInput {
          name: String
          playerName: String
          gender: String
          race: String
          age: Int
          background: String
          level: Int
          statPoints: Int
          skillPoints: Int
          coreStats: CoreStatsInput
          currentHp: Int
          maxHp: Int
          currentMana: Int
          maxMana: Int
          currentStamina: Int
          maxStamina: Int
          wounds: Int
          competencyStates: [CharacterCompetencyStateInput!]
          skillStates: [CharacterSkillStateInput!]
          titleIds: [ID!]
          itemStates: [CharacterItemStateInput!]
        }

        input CreateCampaignInput {
          name: String!
          description: String
          notes: String
        }

        input UpdateCampaignInput {
          name: String
          description: String
          notes: String
        }

        input CreateSkillInput {
          name: String!
          description: String!
          maxRank: Rank!
          activationType: String
          manaCost: Int
          staminaCost: Int
          minLevelRequirement: Int
          requiredAbilityIds: [ID!]
          requiredTitleIds: [ID!]
          tags: [String!]
        }

        input UpdateSkillInput {
          name: String
          description: String
          maxRank: Rank
          activationType: String
          manaCost: Int
          staminaCost: Int
          minLevelRequirement: Int
          requiredAbilityIds: [ID!]
          requiredTitleIds: [ID!]
          tags: [String!]
        }

        input CreateCompetencyInput {
          name: String!
          description: String!
          tags: [String!]
        }

  GraphQlApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQlApi.ApiId

  AppSyncInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeResolverFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: '*'

  CreateCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/characters/createCharacter.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  GetCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/characters/getCharacter.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListCharactersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/characters/listCharacters.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  UpdateCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/characters/updateCharacter.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  DeleteCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/characters/deleteCharacter.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  CreateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/createCampaign.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  GetCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/getCampaign.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListCampaignsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/listCampaigns.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  UpdateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/updateCampaign.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  JoinCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/joinCampaign.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  AssignCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/assignCharacter.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  CreateSkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/skills/createSkill.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListSkillsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/skills/listSkills.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  GetSkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/skills/getSkill.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  UpdateSkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/skills/updateSkill.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ShareSkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/skills/shareSkill.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/skills/listItems.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  CreateCompetencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/competencies/createCompetency.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListCompetenciesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/competencies/listCompetencies.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ShareCompetencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/competencies/shareCompetency.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListTitlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/titles/listTitles.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  ListCampaignCharactersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/campaigns/listCampaignCharacters.handler
      Role: !Ref SharedLambdaExecutionRoleArn
  GetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/resolvers/users/getMe.handler
      Role: !Ref SharedLambdaExecutionRoleArn

  CharactersCreateDataSource:
    Type: AWS::AppSync::DataSource
    Properties: &lambda_ds
      ApiId: !GetAtt GraphQlApi.ApiId
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncInvokeRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CreateCharacterFunction.Arn
      Name: CreateCharacterDataSource
  CharacterGetDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetCharacterFunction.Arn
      Name: GetCharacterDataSource
  CharactersListDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListCharactersFunction.Arn
      Name: ListCharactersDataSource
  CharacterUpdateDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateCharacterFunction.Arn
      Name: UpdateCharacterDataSource
  CharacterDeleteDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt DeleteCharacterFunction.Arn
      Name: DeleteCharacterDataSource
  CampaignCreateDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CreateCampaignFunction.Arn
      Name: CreateCampaignDataSource
  CampaignGetDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetCampaignFunction.Arn
      Name: GetCampaignDataSource
  CampaignListDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListCampaignsFunction.Arn
      Name: ListCampaignsDataSource
  CampaignUpdateDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateCampaignFunction.Arn
      Name: UpdateCampaignDataSource
  CampaignJoinDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt JoinCampaignFunction.Arn
      Name: JoinCampaignDataSource
  CampaignAssignDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt AssignCharacterFunction.Arn
      Name: AssignCharacterDataSource
  SkillCreateDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CreateSkillFunction.Arn
      Name: CreateSkillDataSource
  SkillListDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListSkillsFunction.Arn
      Name: ListSkillsDataSource
  SkillGetDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetSkillFunction.Arn
      Name: GetSkillDataSource
  SkillUpdateDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateSkillFunction.Arn
      Name: UpdateSkillDataSource
  SkillShareDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ShareSkillFunction.Arn
      Name: ShareSkillDataSource
  ItemListDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListItemsFunction.Arn
      Name: ListItemsDataSource
  CompetencyCreateDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CreateCompetencyFunction.Arn
      Name: CreateCompetencyDataSource
  CompetencyListDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListCompetenciesFunction.Arn
      Name: ListCompetenciesDataSource
  CompetencyShareDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ShareCompetencyFunction.Arn
      Name: ShareCompetencyDataSource
  TitlesListDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListTitlesFunction.Arn
      Name: ListTitlesDataSource
  CampaignCharactersDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListCampaignCharactersFunction.Arn
      Name: ListCampaignCharactersDataSource
  GetMeDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      <<: *lambda_ds
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetMeFunction.Arn
      Name: GetMeDataSource

  GetCharacterResolver:
    Type: AWS::AppSync::Resolver
    Properties: &resolver_props
      ApiId: !GetAtt GraphQlApi.ApiId
      RequestMappingTemplate: '{"version":"2017-02-28","operation":"Invoke","payload":$util.toJson($context)}'
      ResponseMappingTemplate: '$util.toJson($context.result)'
      TypeName: Query
      FieldName: getCharacter
      DataSourceName: !GetAtt CharacterGetDataSource.Name
  ListMyCharactersResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listMyCharacters
      DataSourceName: !GetAtt CharactersListDataSource.Name
  GetCampaignResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: getCampaign
      DataSourceName: !GetAtt CampaignGetDataSource.Name
  ListMyCampaignsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listMyCampaigns
      DataSourceName: !GetAtt CampaignListDataSource.Name
  ListCampaignCharactersResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listCampaignCharacters
      DataSourceName: !GetAtt CampaignCharactersDataSource.Name
  ListSkillsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listSkills
      DataSourceName: !GetAtt SkillListDataSource.Name
  ListItemsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listItems
      DataSourceName: !GetAtt ItemListDataSource.Name
  ListCompetenciesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listCompetencies
      DataSourceName: !GetAtt CompetencyListDataSource.Name
  ListTitlesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: listTitles
      DataSourceName: !GetAtt TitlesListDataSource.Name
  GetSkillResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: getSkill
      DataSourceName: !GetAtt SkillGetDataSource.Name
  GetMeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      FieldName: getMe
      DataSourceName: !GetAtt GetMeDataSource.Name
  CreateCharacterResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: createCharacter
      DataSourceName: !GetAtt CharactersCreateDataSource.Name
  UpdateCharacterResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: updateCharacter
      DataSourceName: !GetAtt CharacterUpdateDataSource.Name
  DeleteCharacterResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: deleteCharacter
      DataSourceName: !GetAtt CharacterDeleteDataSource.Name
  CreateCampaignResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: createCampaign
      DataSourceName: !GetAtt CampaignCreateDataSource.Name
  UpdateCampaignResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: updateCampaign
      DataSourceName: !GetAtt CampaignUpdateDataSource.Name
  JoinCampaignResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: joinCampaign
      DataSourceName: !GetAtt CampaignJoinDataSource.Name
  AssignCharacterResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: assignCharacterToCampaign
      DataSourceName: !GetAtt CampaignAssignDataSource.Name
  CreateSkillResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: createSkill
      DataSourceName: !GetAtt SkillCreateDataSource.Name
  UpdateSkillResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: updateSkill
      DataSourceName: !GetAtt SkillUpdateDataSource.Name
  ShareSkillResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: shareSkill
      DataSourceName: !GetAtt SkillShareDataSource.Name
  CreateCompetencyResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: createCompetency
      DataSourceName: !GetAtt CompetencyCreateDataSource.Name
  ShareCompetencyResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      <<: *resolver_props
      TypeName: Mutation
      FieldName: shareCompetency
      DataSourceName: !GetAtt CompetencyShareDataSource.Name

Outputs:
  GraphQlApiUrl:
    Value: !GetAtt GraphQlApi.GraphQLUrl
  GraphQlApiKey:
    Value: !GetAtt GraphQlApiKey.ApiKey
